<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>马来女装镜前穿搭 Skill 教程</title><style>
:root{--ink:#17242b;--muted:#687780;--line:#dbe3e6;--paper:#f8f9f7;--blue:#658da1;--deep:#31596c;--cream:#f1ece3}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:var(--paper);font-family:"Segoe UI","Microsoft YaHei",Arial,sans-serif}.hero{color:#fff;background:linear-gradient(135deg,#234657,#527e94 58%,#a2bac2);padding-bottom:70px}nav{max-width:1120px;height:72px;margin:auto;padding:0 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff30}.brand{display:grid;place-items:center;width:42px;height:42px;border:1px solid #ffffff88;border-radius:50%}.switch{display:flex;padding:4px;border-radius:999px;background:#102b3860}.switch button{padding:8px 13px;border:0;border-radius:999px;color:#ffffffbb;background:transparent;cursor:pointer}.switch .on{color:var(--deep);background:white}.intro{max-width:860px;margin:auto;padding:78px 22px 30px;text-align:center}.intro small{padding:8px 13px;border:1px solid #ffffff55;border-radius:999px}.intro h1{margin:24px 0 12px;font-size:clamp(38px,7vw,68px);line-height:1.05}.intro p{color:#ffffffc9;font-size:18px}.cmd{max-width:600px;margin:32px auto 0;padding:12px 12px 12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid #ffffff44;border-radius:15px;background:#102b3860;text-align:left}.section{max-width:1120px;margin:auto;padding:72px 22px}.head{display:flex;gap:15px;align-items:flex-start;margin-bottom:30px}.head>span{display:grid;place-items:center;min-width:40px;height:40px;border-radius:50%;color:#fff;background:var(--deep);font-size:12px}.head h2{margin:0;font-size:32px}.head p{margin:6px 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.box,.card{padding:22px;border:1px solid var(--line);border-radius:18px;background:#fff}.box code{overflow-wrap:anywhere;color:var(--deep)}.notice{margin-top:15px;padding:17px;border-left:4px solid var(--blue);background:var(--cream)}.band{max-width:none;padding-left:max(22px,calc((100vw - 1076px)/2));padding-right:max(22px,calc((100vw - 1076px)/2));background:#e7eef0}.prompt{position:relative;padding:28px;border-radius:22px;color:#eaf3f5;background:#172a34}.copy{padding:9px 13px;border:0;border-radius:9px;color:var(--deep);background:#eaf2f4;cursor:pointer;font-weight:700}.prompt .copy{position:absolute;top:16px;right:16px}pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.7 Consolas,monospace}.refs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.refs .box p{color:var(--muted);font-size:14px}.search{width:100%;margin-bottom:20px;padding:14px 16px;border:1px solid var(--line);border-radius:12px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card h3{margin:0 0 14px}.card pre{max-height:210px;overflow:auto;padding:16px;border-radius:11px;background:#f0f3f3}.card .copy{margin-top:12px}.rules{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.rules div{padding:15px;border-radius:12px;background:#fff}footer{padding:30px 22px;color:#dce7eb;background:#172a34;text-align:center}@media(max-width:800px){.grid,.refs{grid-template-columns:repeat(2,1fr)}.cards,.rules{grid-template-columns:1fr}}@media(max-width:500px){.grid,.refs{grid-template-columns:1fr}.cmd{flex-direction:column;align-items:stretch}.section{padding:55px 16px}.prompt{padding-top:66px}}
</style></head><body><header class="hero"><nav><b class="brand">MO</b><div class="switch"><button id="zh" class="on">华文</button><button id="en">English</button></div></nav><div class="intro"><small id="badge"></small><h1 id="title"></h1><p id="sub"></p><div class="cmd"><code>$douyin-mirror-outfit-storyboard</code><button class="copy" data-copy="$douyin-mirror-outfit-storyboard"></button></div></div></header><section class="section"><div class="head"><span>01</span><div><h2 id="installTitle"></h2><p id="installSub"></p></div></div><div class="grid" id="steps"></div><div class="notice" id="notice"></div></section><section class="section band"><div class="head"><span>02</span><div><h2 id="quickTitle"></h2><p id="quickSub"></p></div></div><div class="prompt"><pre id="full"></pre><button class="copy" data-target="full"></button></div></section><section class="section"><div class="head"><span>03</span><div><h2 id="refTitle"></h2></div></div><div class="refs" id="refs"></div></section><section class="section"><div class="head"><span>04</span><div><h2 id="recipeTitle"></h2><p id="recipeSub"></p></div></div><input id="search" class="search"><div class="cards" id="cards"></div></section><section class="section band"><div class="head"><span>05</span><div><h2 id="ruleTitle"></h2></div></div><div class="rules" id="rules"></div></section><footer>$douyin-mirror-outfit-storyboard · <span id="offline"></span></footer><script>
const R=[
['只上传产品图','Product image only','使用 $douyin-mirror-outfit-storyboard。\n\n以我上传的产品图为严格主商品参考。使用成年马来西亚女性模特，按照现代马来时尚自动搭配其余服装和鞋子，默认不添加包包。生成一张9:16全身镜前自拍模特图。','Use $douyin-mirror-outfit-storyboard.\n\nTreat my uploaded product image as the strictly locked hero product. Use an adult Malaysian female model and coordinate the remaining garments and footwear. Do not add a bag. Generate one vertical 9:16 full-body mirror selfie.'],
['产品图＋模特图','Product + model','严格按照 @产品图 和 @模特图 生成。@产品图锁定全部商品细节；@模特图锁定同一位成年模特的脸部、肤色、体型、妆容、发型或Hijab。其余穿搭与场景自动完成，不添加包包。','Strictly follow @product_image and @model_image. Lock every product detail and preserve the same adult model identity, body, hair, or Hijab. Complete the styling and scene automatically. Do not add a bag.'],
['产品图＋背景图','Product + background','严格锁定 @产品图，并在 @背景图 的空间中生成9:16全身镜前自拍图。人物和穿搭自动完成，不添加包包。','Strictly lock @product_image and generate a vertical 9:16 mirror selfie in @background_image. Select the model and styling automatically. Do not add a bag.'],
['三图完整锁定','Full three-image lock','严格按照 @产品图、@模特图 和 @背景图 生成，分别锁定商品、人物和空间。补齐缺少的服装和鞋子，不添加包包。','Strictly follow @product_image, @model_image, and @background_image to lock product, identity, and room. Complete missing garments and footwear. Do not add a bag.'],
['多件商品组成整套','Multiple locked products','所有上传产品都属于锁定商品，必须全部使用并保持各自细节。只补充缺少的鞋子、内搭和Hijab，不添加包包。','Treat every uploaded product as locked. Use all items and preserve every detail. Add only missing footwear, inner layers, or Hijab. No bag.'],
['严格复刻模式','Strict reproduction','严格复刻 @产品图 中已有穿搭，不增加、替换或重新设计服装、鞋子和配饰，不添加包包。','Strictly reproduce the outfit in @product_image. Do not add, replace, or redesign garments, footwear, or accessories. No bag.'],
['Hijab端庄模式','Hijab Modest Mode','使用成年马来Hijab女性模特。完整遮盖头发、耳朵、颈部、胸口、肩膀、背部、腰腹和腿部；不用紧身、透视、暴露或性感造型。','Use an adult Malaysian Hijabi model. Fully cover hair, ears, neck, chest, shoulders, back, midriff, underarms, and legs. Avoid tight, sheer, revealing, or sexualized styling.'],
['无Hijab模式','No-Hijab Mode','使用成年马来女性模特，不戴Hijab；不强制端庄模式，保留商品原有短款、修身、无袖或露肩设计，不添加包包。','Use an adult Malaysian female model without Hijab. Do not apply automatic modesty constraints. Preserve the product direction. No bag.'],
['只生成10格分镜','Storyboard only','根据 @产品图、@人物图、@背景图 和 @母版图 生成10镜头分镜。保持同一人物、商品、搭配和场景，只显示01—10，不添加包包。','Using @product_image, @person_image, @background_image, and @master_image, create one 10-shot storyboard. Keep continuity, show only 01–10, and add no bag.'],
['10张独立分镜','10 separate frames','不要生成合成图，分别生成10张9:16分镜，保持全部一致，全程不出现包包。','Generate 10 separate vertical 9:16 frames instead of a contact sheet. Preserve continuity. No bag.'],
['只要Seedance 2.0','Seedance 2.0 only','根据 @商品图、@人物图、@背景图 和 @分镜图，只输出一份10秒Seedance 2.0中文视频提示词。锁定全部参考，不出现包包。','Using @product_image, @person_image, @background_image, and @storyboard_image, output only one complete Chinese Seedance 2.0 prompt. Lock all references. No bag.'],
['只要OmniFlash','OmniFlash only','根据四类英文@参考，只输出一份10秒OmniFlash英文视频提示词，不添加包包。','Using @product_image, @person_image, @background_image, and @storyboard_image, output only one complete English OmniFlash prompt. No bag.'],
['修正已生成图片','Correct a generated image','保持人物、服装和背景不变，只恢复准确版型、移除包包，并保持腰头、抽绳、口袋和鞋子清晰。','Keep person, outfit, and room unchanged. Restore the exact silhouette, remove every bag, and keep key details visible.'],
['更改视频时长','Change video duration','按照 @分镜图 生成15秒Seedance 2.0提示词，重新分配时长，不改变人物、商品、搭配和背景。','Create a 15-second Seedance 2.0 prompt from @storyboard_image. Redistribute timing without changing identity, product, outfit, or room.']];
const D={zh:{badge:'离线小白教程 · v3',title:'马来女装镜前穿搭 Skill',sub:'从安装到成图、分镜与视频提示词，一页学会。',install:'安装',installSub:'Windows / Codex Desktop，约1分钟完成。',steps:['打开 Codex 的 Skills 目录','解压最新版 Skill ZIP','把文件夹放到 C:\\Users\\你的用户名\\.codex\\skills','重新打开一个 Codex 任务'],notice:'文件夹内应直接看到 SKILL.md、agents 和 references，不要多套一层文件夹。',quick:'最推荐的完整指令',quickSub:'上传产品图、模特图和背景图后复制。',ref:'参考图规则',recipe:'全部使用方式',recipeSub:'按你的素材和目标选择。',search:'搜索用法…',rules:'默认规则',offline:'可离线使用',copy:'复制指令',copied:'已复制',full:'使用 $douyin-mirror-outfit-storyboard 完成完整流程。\n\n严格按照 @产品图、@模特图 和 @背景图 生成，分别锁定商品、成年人物和空间。按照现代马来西亚女性时尚补齐服装、鞋和Hijab。检测到Hijab/Tudung时自动端庄。默认不添加包包。\n\n生成：9:16全身镜前自拍图、10镜头分镜、10秒中文动作表、Seedance 2.0中文提示词和OmniFlash英文提示词。禁止换脸、商品漂移、包包、文字、Logo和水印。',rulesList:['上传商品严格锁定；自动搭配属于创意补充。','默认现代马来西亚女性时尚。','检测到Hijab/Tudung自动端庄。','无Hijab时遵循商品原本定位。','默认不添加包包。','始终使用成年模特，无文字、Logo和水印。']},en:{badge:'Offline beginner guide · v3',title:'Malaysian Mirror Outfit Skill',sub:'Install, generate, storyboard, and write video prompts from one page.',install:'Install',installSub:'Windows / Codex Desktop, about one minute.',steps:['Open the Codex Skills directory','Extract the latest Skill ZIP','Place it in C:\\Users\\your-name\\.codex\\skills','Open a new Codex task'],notice:'SKILL.md, agents, and references must appear directly inside the skill folder.',quick:'Recommended full workflow',quickSub:'Upload product, model, and background images, then copy.',ref:'Reference roles',recipe:'All usage recipes',recipeSub:'Choose based on your inputs and desired output.',search:'Search recipes…',rules:'Default rules',offline:'Works offline',copy:'Copy prompt',copied:'Copied',full:'Use $douyin-mirror-outfit-storyboard to complete the full workflow.\n\nStrictly follow @product_image, @model_image, and @background_image to lock product fidelity, adult identity, and room continuity. Complete missing garments, footwear, and Hijab in contemporary Malaysian style. Activate Modest Mode when Hijab/Tudung is present. Do not add a bag.\n\nGenerate a 9:16 mirror selfie, 10-shot storyboard, Chinese action timeline, Chinese Seedance 2.0 prompt, and English OmniFlash prompt. Prohibit identity drift, product drift, bags, text, logos, and watermarks.',rulesList:['Uploaded products remain strictly locked.','Contemporary Malaysian fashion by default.','Hijab/Tudung activates Modest Mode.','Without Hijab, follow the product direction.','No bag by default.','Adult models only; no text, logos, or watermarks.']}};
let L='zh';const $=id=>document.getElementById(id);function render(){const d=D[L];document.documentElement.lang=L;$('badge').textContent=d.badge;$('title').textContent=d.title;$('sub').textContent=d.sub;$('installTitle').textContent=d.install;$('installSub').textContent=d.installSub;$('steps').innerHTML=d.steps.map((x,i)=>`<article class="box"><b>${L==='zh'?'步骤':'Step'} ${i+1}</b><p>${x}</p></article>`).join('');$('notice').textContent=d.notice;$('quickTitle').textContent=d.quick;$('quickSub').textContent=d.quickSub;$('full').textContent=d.full;$('refTitle').textContent=d.ref;$('refs').innerHTML=[['@产品图 / @product_image',L==='zh'?'锁定商品':'Product fidelity'],['@模特图 / @model_image',L==='zh'?'锁定成年人物':'Adult identity'],['@背景图 / @background_image',L==='zh'?'锁定空间':'Environment'],['@分镜图 / @storyboard_image',L==='zh'?'锁定镜头与动作':'Shots and motion']].map(x=>`<article class="box"><code>${x[0]}</code><p>${x[1]}</p></article>`).join('');$('recipeTitle').textContent=d.recipe;$('recipeSub').textContent=d.recipeSub;$('search').placeholder=d.search;$('ruleTitle').textContent=d.rules;$('rules').innerHTML=d.rulesList.map(x=>`<div>✓　${x}</div>`).join('');$('offline').textContent=d.offline;$('zh').className=L==='zh'?'on':'';$('en').className=L==='en'?'on':'';showCards();document.querySelectorAll('.copy').forEach(b=>b.textContent=d.copy)}function showCards(){const q=$('search').value.toLowerCase();$('cards').innerHTML=R.filter(r=>(r[L==='zh'?0:1]+' '+r[L==='zh'?2:3]).toLowerCase().includes(q)).map((r,i)=>`<article class="card"><h3>${String(i+1).padStart(2,'0')}　${r[L==='zh'?0:1]}</h3><pre>${r[L==='zh'?2:3]}</pre><button class="copy" data-text="${encodeURIComponent(r[L==='zh'?2:3])}">${D[L].copy}</button></article>`).join('')}document.addEventListener('click',e=>{const b=e.target.closest('.copy');if(!b)return;const v=b.dataset.copy||b.dataset.text&&decodeURIComponent(b.dataset.text)||$(b.dataset.target).textContent;navigator.clipboard.writeText(v);b.textContent=D[L].copied;setTimeout(()=>b.textContent=D[L].copy,1200)});$('zh').onclick=()=>{L='zh';render()};$('en').onclick=()=>{L='en';render()};$('search').oninput=showCards;render();
</script></body></html>
